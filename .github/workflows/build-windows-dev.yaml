name: build-windows-dev

on:
  workflow_dispatch:
  push:
    branches:
      - fix/responses-custom-tools

permissions:
  contents: read

concurrency:
  group: build-windows-dev
  cancel-in-progress: true

jobs:
  windows-amd64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ninja
        shell: pwsh
        run: |
          choco install -y --no-progress ninja

      - name: Install CUDA 12.8 toolkit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_571.96_windows.exe" -OutFile "cuda_install.exe"
          Start-Process -FilePath .\cuda_install.exe -ArgumentList @('-s','cudart_12.8','nvcc_12.8','cublas_12.8','cublas_dev_12.8') -NoNewWindow -Wait
          $cudaPath = (Resolve-Path "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\*").Path
          echo "$cudaPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build llama.cpp payloads (cpu + cuda12)
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          $vs = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -no_logo'
          ./scripts/build_windows.ps1 cpu
          if ($LASTEXITCODE -ne 0) { throw "cpu build failed" }
          ./scripts/build_windows.ps1 cuda12
          if ($LASTEXITCODE -ne 0) { throw "cuda12 build failed" }

      - name: Verify payloads
        shell: bash
        run: |
          set -euo pipefail
          [ -f dist/windows-amd64/lib/ollama/llama-server.exe ] || { echo "missing llama-server.exe"; exit 1; }
          [ -f dist/windows-amd64/lib/ollama/cuda_v12/ggml-cuda.dll ] || { echo "missing cuda_v12 payload"; exit 1; }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            LLAMA_CPP_VERSION
            MLX_VERSION
            MLX_C_VERSION

      - name: Install llvm-mingw (gcc -> clang)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-x86_64.zip" -OutFile "$env:RUNNER_TEMP\llvm-mingw-ucrt.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\llvm-mingw-ucrt.zip" -DestinationPath "C:\Program Files\"
          $installPath = (Resolve-Path -Path "C:\Program Files\llvm-mingw-*-ucrt-x86_64").Path
          echo "$installPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (!(Test-Path "$installPath\bin\x86_64-w64-mingw32-gcc.exe")) {
            throw "llvm-mingw is missing the x86_64 gcc"
          }

      - name: Build ollama.exe (amd64)
        shell: pwsh
        run: |
          ./scripts/build_windows ollama

      - name: Verify ollama.exe
        shell: bash
        run: |
          set -euo pipefail
          [ -f dist/windows-amd64/ollama.exe ] || { echo "missing ollama.exe"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-windows-amd64-dev
          path: |
            dist/windows-amd64/ollama.exe
            dist/windows-amd64/lib/
          if-no-files-found: error
