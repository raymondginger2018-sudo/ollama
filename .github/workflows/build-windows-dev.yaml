name: build-windows-dev

on:
  workflow_dispatch:
  push:
    branches:
      - fix/responses-custom-tools

permissions:
  contents: read

concurrency:
  group: build-windows-dev
  cancel-in-progress: true

jobs:
  windows-amd64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ninja + ccache
        shell: pwsh
        run: |
          choco install -y --no-progress ninja ccache
          if (Get-Command ccache -ErrorAction SilentlyContinue) {
            ccache -o cache_dir="${{ github.workspace }}\.ccache"
          }

      # CPU-only llama.cpp payload (windows-amd64).
      # Mirrors the CPU branch of the upstream release.yaml windows-depends job.
      - name: Build llama.cpp CPU payload (amd64)
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          $vs = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -no_logo'
          ./scripts/build_windows.ps1 cpu

      - name: Verify CPU payload
        shell: bash
        run: |
          set -euo pipefail
          [ -f dist/windows-amd64/lib/ollama/llama-server.exe ] || { echo "missing payload"; exit 1; }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            LLAMA_CPP_VERSION
            MLX_VERSION
            MLX_C_VERSION

      # cgo on Windows needs a clang-based gcc (llvm-mingw). Same as upstream
      # windows-build job.
      - name: Install llvm-mingw (gcc -> clang)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-x86_64.zip" -OutFile "$env:RUNNER_TEMP\llvm-mingw-ucrt.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\llvm-mingw-ucrt.zip" -DestinationPath "C:\Program Files\"
          $installPath = (Resolve-Path -Path "C:\Program Files\llvm-mingw-*-ucrt-x86_64").Path
          echo "$installPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (!(Test-Path "$installPath\bin\x86_64-w64-mingw32-gcc.exe")) {
            throw "llvm-mingw is missing the x86_64 gcc"
          }

      - name: Build ollama.exe (amd64)
        shell: pwsh
        run: |
          ./scripts/build_windows ollama

      - name: Verify ollama.exe
        shell: bash
        run: |
          set -euo pipefail
          [ -f dist/windows-amd64/ollama.exe ] || { echo "missing ollama.exe"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-windows-amd64-dev
          path: |
            dist/windows-amd64/ollama.exe
            dist/windows-amd64/lib/
          if-no-files-found: error
